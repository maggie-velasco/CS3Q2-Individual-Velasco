<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1">

    <title>Q4-Graded exercise 1</title>
    <meta name="author" content="K28">
    <link rel = "stylesheet" href = "q41gPotassiumVelasco.css">
  </head>
  <body>
    <div class="box">
        <h1>Add a Movie</h1>
        <form id="formHEH" method="post">
            <label>Title<br/><input type="textbox" id="title" placeholder="Title of Movie" required></label><br/><br/>
            <label>Year<br/><input type="number" id="year" placeholder="Year of Movie" required></label><br/><br/>
            <label>Genre<br/>
                <select id="genre" required>
                    <option>Action</option>
                    <option>Adventure</option>
                    <option>Comedy</option>
                    <option>Drama</option>
                    <option>Fantasy</option>
                    <option>Horror</option>
                    <option>Romance</option>
                    <option>Sci-fi</option>
                    <option>Thriller</option>
                </select>
            </label><br/><br/>

            <p>Rating: <span id="rateOutput">0</span></p>

            <div name="rate" class="stars" id="starRating">
                <span class = "star" data-value="1">&#9733;</span>
                <span class = "star" data-value="2">&#9733;</span>
                <span class = "star" data-value="3">&#9733;</span>
                <span class = "star" data-value="4">&#9733;</span>
                <span class = "star" data-value="5">&#9733;</span>
            </div><br/>
            <button type="submit" id="addbtn" onclick="add()">Add Movie</button>
        </form>

        <h1>Movie list</h1>
        <p id="list"></p>

    </div>

    <footer>
        <h4>&copy K28 Velasco. All Rights Reserved.</h4>
    </footer>
    <script src="q41gPotassiumVelasco.js"></script>
  </body>
  
</html>
